<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/public/icons/page-icon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/public/icons/page-icon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/public/icons/page-icon/favicon-16x16.png"
    />
    <link rel="icon" href="/public/icons/page-icon/favicon.ico" />
  </head>
  <body>
    <!-- Formulario para registrar facturas -->
    <h2>Registrar Factura</h2>
    <form id="facturaForm">
      <input type="text" id="form-empresa" placeholder="Empresa" required />
      <input
        type="text"
        id="form-numero-factura"
        placeholder="Número de Factura"
        required
      />
      <input type="date" id="form-fecha" required />
      <input type="number" id="form-valor" placeholder="Valor" required />
      <button type="submit">Registrar Factura</button>
    </form>

    <!-- Scripts -->
    <script type="module" src="/src/scripts/auth-guard.js"></script>
    <script type="module" src="/src/scripts/crearFacturas.js"></script>
  </body>
</html>
